name: GitHub Metrics

on:
  schedule:
    - cron: "0 16 * * *"  # Midnight PHT (UTC+8)
  workflow_dispatch:
  push:
    branches: ["main"]

# Prevent concurrent runs from racing
concurrency:
  group: metrics-update
  cancel-in-progress: true

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          # Base
          user: sjpavlis
          template: classic
          config_timezone: Asia/Manila
          config_output: github-metrics.svg
          repositories_forks: no
          config_padding: 0, 8 + 11%

          # Languages (includes private repos via token scope)
          plugin_languages: yes
          plugin_languages_analysis_timeout: 30
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_recent_days: 30
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%
          plugin_languages_indepth: yes

          # Lines of code
          plugin_lines: yes
          plugin_lines_history_limit: 1
          plugin_lines_sections: base

          # Isocalendar (full year contribution calendar)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Habits (disabled — upstream bug with sparse commit history)
          plugin_habits: no
          # plugin_habits_charts_type: classic
          # plugin_habits_days: 30
          # plugin_habits_facts: yes
          # plugin_habits_from: 200

          # Achievements (disabled — GitHub deprecated Projects Classic API, breaks plugin)
          plugin_achievements: yes
          plugin_achievements_display: detailed
          plugin_achievements_secrets: yes
          plugin_achievements_threshold: C

          # Stars
          plugin_stargazers: yes
          plugin_stars: yes
          plugin_stars_limit: 4

          # Follow-up (issues/PRs ratio)
          plugin_followup: yes
          plugin_followup_sections: repositories

          # Notable contributions
          plugin_notable: yes
          plugin_notable_from: organization

          # Activity (disabled — upstream bug with undefined event data)
          plugin_activity: no
          # plugin_activity_days: 14
          # plugin_activity_filter: all
          # plugin_activity_limit: 5
          # plugin_activity_visibility: all

          # Traffic
          plugin_traffic: yes

          # Gists
          plugin_gists: yes

          # Retry on API failures
          retries: 3
          retries_delay: 300
